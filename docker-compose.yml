# OctaveOneCloud — single-host deployment (Docker Compose / Dokploy).
# A single host is NOT high availability; see docs/runbooks/backup-restore.md and deployment.md.
# Only the web service is published. Postgres, Redis, the API and the worker stay on the private network;
# the web container proxies /api/* to the API internally.
name: octaveonecloud

x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql://ooc:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/ooc
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ooc
      POSTGRES_DB: ooc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ooc -d ooc"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]

  migrate:
    build: { context: ., dockerfile: docker/Dockerfile, target: migrate }
    <<: *app-env
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"
    networks: [internal]

  api:
    build: { context: ., dockerfile: docker/Dockerfile, target: api }
    <<: *app-env
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  worker:
    build: { context: ., dockerfile: docker/Dockerfile, target: worker }
    <<: *app-env
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 60s
    networks: [internal]

  web:
    build: { context: ., dockerfile: docker/Dockerfile, target: web }
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }
    ports: ["${WEB_PORT:-3000}:3000"]
    security_opt: ["no-new-privileges:true"]
    networks: [internal, public]

volumes:
  pgdata:
  redisdata:

networks:
  internal:
    internal: true
  public:
