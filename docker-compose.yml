# OctaveOneCloud — production stack for Dokploy (Docker Compose) or any Docker host.
#
# Dokploy: create a "Compose" service from this repository (compose path ./docker-compose.yml), paste the
# variables from deploy/dokploy.env.example into the Environment tab, enable "Isolated Deployments",
# and add your domain on the `web` service, port 3000. Full guide: docs/deploy-dokploy.md
#
# Only `web` is meant to be routed publicly (through Dokploy's Traefik). Postgres, Redis, the API and the
# worker publish no ports. The web container proxies /api/* to the API over the internal network.
# A single host is NOT high availability: see docs/runbooks/backup-restore.md.
name: octaveonecloud

x-app: &app
  init: true
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  security_opt: ["no-new-privileges:true"]

x-db-urls: &db-urls
  # Use URL-safe (e.g. hex) passwords — scripts/generate-secrets.mjs produces them.
  DATABASE_URL: postgresql://ooc:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/ooc
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ooc
      POSTGRES_DB: ooc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ooc -d ooc"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  migrate:
    <<: *app
    build: { context: ., dockerfile: docker/Dockerfile, target: migrate }
    image: octaveonecloud/migrate:${IMAGE_TAG:-local}
    restart: "no"
    environment:
      <<: *db-urls
      MIGRATE_MODE: ${MIGRATE_MODE:-fallback}
      SEED_DRAFT_CATALOGUE: ${SEED_DRAFT_CATALOGUE:-false}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    build: { context: ., dockerfile: docker/Dockerfile, target: api }
    image: octaveonecloud/api:${IMAGE_TAG:-local}
    environment:
      <<: *db-urls
      NODE_ENV: production
      PORT: "4000"
    expose: ["4000"]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    build: { context: ., dockerfile: docker/Dockerfile, target: worker }
    image: octaveonecloud/worker:${IMAGE_TAG:-local}
    environment:
      <<: *db-urls
      NODE_ENV: production
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        API_INTERNAL_URL: http://api:4000
    image: octaveonecloud/web:${IMAGE_TAG:-local}
    environment:
      API_INTERNAL_URL: http://api:4000
      NODE_ENV: production
    expose: ["3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
