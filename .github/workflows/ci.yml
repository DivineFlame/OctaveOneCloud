name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.10-alpine
        env: { POSTGRES_USER: ooc, POSTGRES_PASSWORD: ooc, POSTGRES_DB: ooc_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ooc" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql://ooc:ooc@localhost:5432/ooc_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - name: Refuse committed secrets and dumps
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then echo "::error::.env file is tracked"; exit 1; fi
          if git ls-files | grep -E '\.(rdb|dump|sql\.gz|pem|key)$'; then echo "::error::dump/key file is tracked"; exit 1; fi
      - name: Lint deployment scripts
        run: shellcheck deploy/vps/*.sh deploy/postgres/*.sh
      - uses: pnpm/action-setup@v4   # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: |
          pnpm --filter @ooc/db run generate
          pnpm --filter @ooc/shared run build
          pnpm --filter @ooc/db run build
          pnpm --filter @ooc/integrations run build
          pnpm --filter @ooc/api run build
          pnpm --filter @ooc/worker run build
          pnpm --filter @ooc/web run build
      - run: pnpm -r run typecheck
      - run: pnpm -r run test
      - name: Migrations match schema.prisma
        run: pnpm db:check
      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level high

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      matrix:
        target: [api, worker, migrate, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Compose file is valid
        if: matrix.target == 'api'
        run: POSTGRES_PASSWORD=x REDIS_PASSWORD=y docker compose -f docker-compose.yml config --quiet
